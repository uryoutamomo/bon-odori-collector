<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>用語集v2 未判定レビュー</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f8fa;
      --panel: #ffffff;
      --text: #20242a;
      --muted: #667085;
      --line: #d8dee8;
      --accent: #0f766e;
      --danger: #b42318;
      --warn: #a15c07;
      --hold: #475467;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(247, 248, 250, 0.96);
      border-bottom: 1px solid var(--line);
      padding: 14px 20px;
      backdrop-filter: blur(8px);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 20px;
      letter-spacing: 0;
    }
    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    .summary {
      color: var(--muted);
      font-size: 14px;
      margin-right: auto;
    }
    button {
      border: 1px solid var(--line);
      background: white;
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 14px;
      cursor: pointer;
    }
    button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: white;
    }
    main {
      padding: 18px 20px 40px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .filter {
      border: 1px solid var(--line);
      background: white;
      border-radius: 999px;
      padding: 6px 10px;
      color: var(--muted);
      cursor: pointer;
      font-size: 13px;
    }
    .filter.active {
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 700;
    }
    section {
      margin: 20px 0;
    }
    h2 {
      font-size: 16px;
      margin: 0 0 10px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      margin: 10px 0;
    }
    .card.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.14);
    }
    .row-head {
      display: grid;
      grid-template-columns: minmax(130px, 220px) minmax(0, 1fr) auto;
      gap: 12px;
      align-items: start;
    }
    .term {
      font-size: 17px;
      font-weight: 800;
    }
    .meta {
      color: var(--muted);
      font-size: 12px;
      margin-top: 2px;
    }
    .interpretation {
      font-size: 14px;
    }
    .choices {
      display: grid;
      grid-template-columns: repeat(4, 86px);
      gap: 6px;
    }
    .choice {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      user-select: none;
      background: white;
    }
    .choice input { display: none; }
    .choice:has(input:checked) {
      color: white;
      font-weight: 700;
    }
    .choice.accept:has(input:checked) { background: var(--accent); border-color: var(--accent); }
    .choice.reject:has(input:checked) { background: var(--danger); border-color: var(--danger); }
    .choice.merge:has(input:checked) { background: var(--warn); border-color: var(--warn); }
    .choice.hold:has(input:checked) { background: var(--hold); border-color: var(--hold); }
    details {
      margin-top: 10px;
      color: var(--muted);
      font-size: 13px;
    }
    details p {
      margin: 8px 0;
      color: var(--text);
    }
    .note {
      margin-top: 10px;
      width: 100%;
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px;
      font: inherit;
      resize: vertical;
    }
    .help {
      color: var(--muted);
      font-size: 13px;
      width: 100%;
    }
    kbd {
      border: 1px solid var(--line);
      border-bottom-width: 2px;
      border-radius: 4px;
      background: white;
      padding: 1px 5px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
    }
    a { color: var(--accent); }
    @media (max-width: 760px) {
      .row-head {
        grid-template-columns: 1fr;
      }
      .choices {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>

      </div>
    </div>

          <textarea class="note" data-key="${escapeHtml(key)}" placeholder="メモ、代表語、まとめ先など">${escapeHtml(note)}</textarea>
          <details>
            <summary>証拠と理由</summary>
            <p><strong>理由:</strong> ${escapeHtml(row.reason)}</p>
            <p><strong>証拠:</strong> ${escapeHtml(row.evidence_text)}</p>
            <p><a href="${escapeAttr(row.evidence_url)}" target="_blank" rel="noreferrer">証拠URLを開く</a></p>
          </details>
        </article>
      `;
    }
    function choiceHtml(key, label, klass, decision) {
      return `<label class="choice ${klass}"><input type="radio" name="${escapeAttr(key)}" data-key="${escapeAttr(key)}" value="${label}" ${decision === label ? "checked" : ""}>${label}</label>`;
    }
    function visibleCards() {
      return [...document.querySelectorAll(".card")];
    }
    function markActive(scroll = true) {
      const cards = visibleCards();
      cards.forEach(card => card.classList.remove("active"));
      if (!cards.length) return;
      activeIndex = Math.max(0, Math.min(activeIndex, cards.length - 1));
      const card = cards[activeIndex];
      card.classList.add("active");
      if (scroll) card.scrollIntoView({ block: "center", behavior: "smooth" });
    }
    function moveActive(delta) {
      const cards = visibleCards();
      if (!cards.length) return;
      activeIndex = Math.max(0, Math.min(activeIndex + delta, cards.length - 1));
      markActive(true);
    }
    function setDecisionForActive(decision) {
      const cards = visibleCards();
      const card = cards[activeIndex];
      if (!card) return;
      const key = card.dataset.key;
      const input = card.querySelector(`input[value="${decision}"]`);
      if (input) input.checked = true;
      const state = loadState();
      state[key] = state[key] || {};
      state[key].decision = decision;
      saveState(state);
      if (onlyUnreviewed) {
        render();
      } else {
        moveActive(1);
      }
    }
    function focusNoteForActive() {
      const cards = visibleCards();
      const card = cards[activeIndex];
      const note = card && card.querySelector("textarea");
      if (note) note.focus();
    }
    function exportResults() {
      const state = loadState();
      const rows = TERMS.map(row => ({
        term: row.term,
        category: row.category,
        type: row.type,
        confidence: row.confidence,
        interpretation: row.interpretation,
        evidence_url: row.evidence_url,
        decision: (state[keyFor(row)] || {}).decision || "",
        note: (state[keyFor(row)] || {}).note || ""
      }));
      const output = {
        exported_at: new Date().toISOString(),
        total: rows.length,
        rows
      };
      const blob = new Blob([JSON.stringify(output, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = DOWNLOAD_NAME;
      a.click();
      URL.revokeObjectURL(a.href);
    }
    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
    }
    function escapeAttr(value) {
      return escapeHtml(value).replace(/`/g, "&#96;");
    }
    document.getElementById("exportJson").addEventListener("click", exportResults);
    document.getElementById("showUnreviewed").addEventListener("click", () => { onlyUnreviewed = true; render(); });
    document.getElementById("showAll").addEventListener("click", () => { onlyUnreviewed = false; render(); });
    document.addEventListener("keydown", event => {
      const target = event.target;
      const typing = target && ["TEXTAREA", "INPUT"].includes(target.tagName);
      if (typing && event.key !== "Escape") return;
      if (event.key === "Escape" && typing) {
        target.blur();
        event.preventDefault();
        return;
      }
      const actions = {
        "j": () => moveActive(1),
        "ArrowDown": () => moveActive(1),
        "k": () => moveActive(-1),
        "ArrowUp": () => moveActive(-1),
        "1": () => setDecisionForActive("採用"),
        "2": () => setDecisionForActive("不採用"),
        "3": () => setDecisionForActive("まとめ"),
        "4": () => setDecisionForActive("保留"),
        "n": () => focusNoteForActive(),
        "u": () => { onlyUnreviewed = true; activeIndex = 0; render(); },
        "a": () => { onlyUnreviewed = false; activeIndex = 0; render(); },
        "e": () => exportResults()
      };
      const action = actions[event.key];
      if (action) {
        event.preventDefault();
        action();
      }
    });
    loadInitialState();
    render();
  </script>
</body>
</html>
