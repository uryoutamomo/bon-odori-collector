AWSTemplateFormatVersion: "2010-09-09"
Description: DynamoDB queue and GitHub Actions OIDC role for bon-odori-collector

Parameters:
  GitHubOwner:
    Type: String
    Default: uryoutamomo
  GitHubRepository:
    Type: String
    Default: bon-odori-collector
  StaticSiteGitHubRepository:
    Type: String
    Default: bon-odori-site
  GitHubBranch:
    Type: String
    Default: main
  TableName:
    Type: String
    Default: bon-odori-torimochi-queue
  EventCandidateTableName:
    Type: String
    Default: bon-odori-event-candidate-queue
  MasterRdbBucketName:
    Type: String
    Default: bon-odori-master-rdb-169805602203
  MasterRdbPrefix:
    Type: String
    Default: master-rdb

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      Tags:
        - Key: Project
          Value: bon-odori-collector

  QueueTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref TableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: venue_key
          AttributeType: S
      KeySchema:
        - AttributeName: venue_key
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false
      Tags:
        - Key: Project
          Value: bon-odori-collector

  EventCandidateQueueTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref EventCandidateTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: candidate_key
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: updated_at
          AttributeType: S
        - AttributeName: notion_page_id
          AttributeType: S
      KeySchema:
        - AttributeName: candidate_key
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: status-updated_at-index
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: updated_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: notion_page_id-index
          KeySchema:
            - AttributeName: notion_page_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false
      Tags:
        - Key: Project
          Value: bon-odori-collector

  MasterRdbArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref MasterRdbBucketName
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireNoncurrentLatestVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 90
            Filter:
              Prefix: !Sub "${MasterRdbPrefix}/latest/"
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - Key: Project
          Value: bon-odori-collector

  GitHubActionsQueueRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: bon-odori-collector-queue
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${GitHubOwner}/${GitHubRepository}:ref:refs/heads/${GitHubBranch}
                  - !Sub repo:${GitHubOwner}/${StaticSiteGitHubRepository}:ref:refs/heads/${GitHubBranch}
      Policies:
        - PolicyName: DynamoDbQueueAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:DescribeTable
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt QueueTable.Arn
              - Effect: Allow
                Action:
                  - dynamodb:DescribeTable
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                  - dynamodb:UpdateItem
                Resource:
                  - !GetAtt EventCandidateQueueTable.Arn
                  - !Sub "${EventCandidateQueueTable.Arn}/index/*"
        - PolicyName: StaticSiteDeployAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ListBonsukeSiteBucket
                Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource: arn:aws:s3:::bonsuke-site-prod
              - Sid: WriteBonsukeSiteObjects
                Effect: Allow
                Action:
                  - s3:DeleteObject
                  - s3:GetObject
                  - s3:PutObject
                Resource: arn:aws:s3:::bonsuke-site-prod/*
              - Sid: InvalidateBonsukeCloudFront
                Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: arn:aws:cloudfront::169805602203:distribution/ERA76BJB7WLEN
        - PolicyName: MasterRdbArtifactAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ListMasterRdbArtifactBucket
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt MasterRdbArtifactBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix:
                      - !Sub "${MasterRdbPrefix}/*"
              - Sid: GetMasterRdbArtifactBucketLocation
                Effect: Allow
                Action: s3:GetBucketLocation
                Resource: !GetAtt MasterRdbArtifactBucket.Arn
              - Sid: ReadWriteMasterRdbArtifacts
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub "${MasterRdbArtifactBucket.Arn}/${MasterRdbPrefix}/*"
        - PolicyName: StaticSiteCustomDomainAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadRoute53HostedZones
                Effect: Allow
                Action:
                  - route53:GetHostedZone
                  - route53:ListHostedZonesByName
                Resource: "*"
              - Sid: WriteBonsukeDomainRecords
                Effect: Allow
                Action:
                  - route53:ChangeResourceRecordSets
                  - route53:ListResourceRecordSets
                Resource: arn:aws:route53:::hostedzone/*
              - Sid: ManageBonsukeAcmCertificate
                Effect: Allow
                Action:
                  - acm:DescribeCertificate
                  - acm:ListCertificates
                  - acm:RequestCertificate
                Resource: "*"
              - Sid: ManageBonsukeCloudFrontDomain
                Effect: Allow
                Action:
                  - cloudfront:GetDistribution
                  - cloudfront:GetDistributionConfig
                  - cloudfront:UpdateDistribution
                Resource: arn:aws:cloudfront::169805602203:distribution/ERA76BJB7WLEN
        - PolicyName: StaticSiteProtectionAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ManageBonsukeWaf
                Effect: Allow
                Action:
                  - wafv2:CreateWebACL
                  - wafv2:GetWebACL
                  - wafv2:ListWebACLs
                  - wafv2:UpdateWebACL
                Resource: "*"
              - Sid: ManageBonsukeContactLambda
                Effect: Allow
                Action:
                  - lambda:AddPermission
                  - lambda:CreateFunction
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                Resource:
                  - arn:aws:lambda:ap-northeast-1:169805602203:function:bonsuke-contact-form
                  - arn:aws:lambda:ap-northeast-1:169805602203:function:bonsuke-contact-form-receive
              - Sid: ManageBonsukeContactLambdaRole
                Effect: Allow
                Action:
                  - iam:AttachRolePolicy
                  - iam:CreateRole
                  - iam:GetRole
                  - iam:PassRole
                  - iam:PutRolePolicy
                Resource: arn:aws:iam::169805602203:role/bonsuke-contact-form-lambda-role
              - Sid: ManageBonsukeContactApi
                Effect: Allow
                Action:
                  - apigateway:DELETE
                  - apigateway:GET
                  - apigateway:PATCH
                  - apigateway:POST
                  - apigateway:PUT
                Resource: arn:aws:apigateway:ap-northeast-1::/*
              - Sid: ManageBonsukeContactApiV2
                Effect: Allow
                Action:
                  - apigateway:DELETE
                  - apigateway:GET
                  - apigateway:PATCH
                  - apigateway:POST
                  - apigateway:PUT
                Resource: "*"
              - Sid: ManageBonsukeContactSes
                Effect: Allow
                Action:
                  - ses:CreateReceiptRule
                  - ses:CreateReceiptRuleSet
                  - ses:DescribeReceiptRule
                  - ses:DescribeReceiptRuleSet
                  - ses:GetEmailIdentity
                  - ses:ListEmailIdentities
                  - ses:SendEmail
                  - ses:SetActiveReceiptRuleSet
                  - ses:UpdateReceiptRule
                  - ses:VerifyDomainIdentity
                  - ses:VerifyDomainDkim
                  - ses:CreateEmailIdentity
                Resource: "*"
              - Sid: ManageBonsukeContactMailBucket
                Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:GetBucketLocation
                  - s3:ListBucket
                  - s3:PutBucketPolicy
                  - s3:PutBucketPublicAccessBlock
                Resource: arn:aws:s3:::bonsuke-contact-mail-169805602203
              - Sid: ReadBonsukeContactMailObjects
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: arn:aws:s3:::bonsuke-contact-mail-169805602203/incoming/*
      Tags:
        - Key: Project
          Value: bon-odori-collector

Outputs:
  QueueTableName:
    Value: !Ref QueueTable
  EventCandidateQueueTableName:
    Value: !Ref EventCandidateQueueTable
  MasterRdbS3BucketName:
    Value: !Ref MasterRdbArtifactBucket
  MasterRdbS3Prefix:
    Value: !Ref MasterRdbPrefix
  GitHubActionsRoleArn:
    Value: !GetAtt GitHubActionsQueueRole.Arn
