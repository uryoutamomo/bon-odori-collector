AWSTemplateFormatVersion: "2010-09-09"
Description: DynamoDB queue and GitHub Actions OIDC role for bon-odori-collector

Parameters:
  GitHubOwner:
    Type: String
    Default: uryoutamomo
  GitHubRepository:
    Type: String
    Default: bon-odori-collector
  GitHubBranch:
    Type: String
    Default: main
  TableName:
    Type: String
    Default: bon-odori-torimochi-queue
  EventCandidateTableName:
    Type: String
    Default: bon-odori-event-candidate-queue

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      Tags:
        - Key: Project
          Value: bon-odori-collector

  QueueTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref TableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: venue_key
          AttributeType: S
      KeySchema:
        - AttributeName: venue_key
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false
      Tags:
        - Key: Project
          Value: bon-odori-collector

  EventCandidateQueueTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref EventCandidateTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: candidate_key
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: updated_at
          AttributeType: S
        - AttributeName: notion_page_id
          AttributeType: S
      KeySchema:
        - AttributeName: candidate_key
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: status-updated_at-index
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: updated_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: notion_page_id-index
          KeySchema:
            - AttributeName: notion_page_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false
      Tags:
        - Key: Project
          Value: bon-odori-collector

  GitHubActionsQueueRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: bon-odori-collector-queue
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubOwner}/${GitHubRepository}:ref:refs/heads/${GitHubBranch}
      Policies:
        - PolicyName: DynamoDbQueueAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:DescribeTable
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt QueueTable.Arn
              - Effect: Allow
                Action:
                  - dynamodb:DescribeTable
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                  - dynamodb:UpdateItem
                Resource:
                  - !GetAtt EventCandidateQueueTable.Arn
                  - !Sub "${EventCandidateQueueTable.Arn}/index/*"
      Tags:
        - Key: Project
          Value: bon-odori-collector

Outputs:
  QueueTableName:
    Value: !Ref QueueTable
  EventCandidateQueueTableName:
    Value: !Ref EventCandidateQueueTable
  GitHubActionsRoleArn:
    Value: !GetAtt GitHubActionsQueueRole.Arn
