name: youtube-daily-backfill

on:
  schedule:
    # YouTube日次バックフィルの正の自動実行元。
    # ローカルLaunchAgentは手動フォールバック専用にする。
    # 毎日 05:00 JST (UTC 20:00) に実行。
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'APIを使わず、選択対象だけ確認する'
        required: false
        type: boolean
        default: false
      max_batches:
        description: '手動実行時の最大バッチ数。0ならquota制限まで続ける'
        required: false
        default: '0'

concurrency:
  group: bon-odori-master-rdb
  cancel-in-progress: false

jobs:
  youtube-backfill:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    env:
      YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
      MAX_BATCHES: ${{ inputs.max_batches || '0' }}
      DRY_RUN: ${{ inputs.dry_run || false }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Fast-forward main
      run: git pull --ff-only origin main

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Configure AWS credentials
      if: ${{ vars.AWS_ROLE_ARN != '' }}
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ vars.AWS_ROLE_ARN }}
        aws-region: ap-northeast-1

    - name: Fetch voices artifact
      env:
        VOICES_S3_BUCKET: ${{ vars.VOICES_S3_BUCKET }}
        VOICES_S3_PREFIX: ${{ vars.VOICES_S3_PREFIX || 'voices' }}
        AWS_REGION: ap-northeast-1
      run: python voices_s3_artifact.py fetch --overwrite

    - name: Fetch master RDB artifact
      if: ${{ vars.MASTER_DB_S3_BUCKET != '' }}
      env:
        MASTER_DB_S3_BUCKET: ${{ vars.MASTER_DB_S3_BUCKET }}
        MASTER_DB_S3_PREFIX: ${{ vars.MASTER_DB_S3_PREFIX || 'master-rdb' }}
        AWS_REGION: ap-northeast-1
      run: python master_db_s3_artifact.py fetch --overwrite

    - name: Audit fetched master RDB
      if: ${{ vars.MASTER_DB_S3_BUCKET != '' }}
      run: |
        python audit_master_rdb.py \
          --out-json "$RUNNER_TEMP/master_rdb_audit.json" \
          --out-md "$RUNNER_TEMP/master_rdb_audit.md" \
          --append-github-summary

    - name: Check YouTube API key
      if: ${{ env.DRY_RUN != 'true' }}
      run: test -n "$YOUTUBE_DATA_API_KEY"

    - name: Run YouTube daily backfill
      run: |
        TODAY="$(TZ=Asia/Tokyo date +%F)"
        TARGET_YEAR="${TODAY%%-*}"
        FLAGS=""
        if [ "$DRY_RUN" = "true" ]; then
          FLAGS="$FLAGS --dry-run"
        fi
        if [ "$MAX_BATCHES" != "0" ]; then
          FLAGS="$FLAGS --max-batches $MAX_BATCHES"
        fi
        python run_daily_youtube_backfill.py \
          --target-year "$TARGET_YEAR" \
          --as-of "$TODAY" \
          --month 8 \
          --auto-next-month \
          --focus-month 8 \
          --focus-month 7 \
          --limit 1 \
          --max-results 5 \
          --retry-selected \
          --retry-cooldown-days 30 \
          --max-consecutive-no-yield 10 \
          --until-quota-limited \
          --mail-reminder \
          $FLAGS

    - name: Append run summary
      run: |
        if [ -f data/youtube_daily_backfill_report.md ]; then
          echo "## YouTube日次バックフィル詳細" >> "$GITHUB_STEP_SUMMARY"
          cat data/youtube_daily_backfill_report.md >> "$GITHUB_STEP_SUMMARY"
        fi
        if [ -f data/ops_metrics_latest.md ]; then
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## 運用メトリクス最新" >> "$GITHUB_STEP_SUMMARY"
          cat data/ops_metrics_latest.md >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Run post-batch maintenance report
      run: python run_post_batch_maintenance.py --append-github-summary

    # 結果は main へ直接コミットする(collect.yml と同じ作法)。
    # 以前は automation/youtube-daily-backfill ブランチ + 自動PR方式だったが、
    # PR #3 が 2026-06-30 に close された後も `gh pr view <branch>` が closed PR に
    # ヒットするため「閉じたPRの本文を書き換えるだけ」を約1か月繰り返し、
    # 毎日の成果が main へ一度も届かないまま捨てられていた。
    # ブランチは毎回 main から作り直されるため、日々の出力はレビュー価値のある
    # 差分ではなく単なるデータ更新であり、PR を挟む意味も薄い。
    - name: Commit results to main
      id: commit
      if: ${{ env.DRY_RUN != 'true' }}
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add data/youtube_daily_backfill_report.json
        git add data/youtube_daily_backfill_report.md
        git add data/youtube_backfill_retry_state.json
        git add data/youtube_year_backfill_candidates.json
        git add data/youtube_year_backfill_candidates.md
        git add data/event_occurrence_backfill_plan.json
        git add data/event_occurrence_backfill_plan.md
        git add data/event_occurrence_observations.json
        git add data/event_occurrence_observations.md
        git add data/low_confidence_backfill_review.md
        git add data/event_schedule_rules.json
        git add data/event_schedule_rules.md
        git add data/event_date_predictions.json
        git add data/event_date_predictions.md
        # data/public/events_public.json / .js はここでは staging しない。
        # このジョブの export は observed 層の unmatched 行(YouTube動画タイトルの
        # 引用部分をまるごと1曲名として取り込んだもの等)を公開JSONへ流し込むため、
        # main へ入れると sync-public-data の定時実行がそのまま本番公開してしまう。
        # 公開JSONは collect.yml が RDB(curated層)から日次生成するものを正本とする。
        git add data/public_date_prediction_apply_result.json
        git add data/public_historical_reference_dry_run.json
        git add data/public_season_hint_dry_run.json
        git add data/ops_metrics_history.jsonl
        git add data/ops_metrics_latest.md
        git add data/ops_metrics_dashboard.html
        git add data/month_06_youtube_backfill_queue.json
        git add data/month_06_youtube_backfill_queue.md
        git add data/month_07_youtube_backfill_queue.json
        git add data/month_07_youtube_backfill_queue.md
        git add data/month_08_youtube_backfill_queue.json
        git add data/month_08_youtube_backfill_queue.md
        if python master_rdb_freeze_policy.py is-frozen legacy_song_occurrence_generation; then
          echo "[master-rdb] legacy song occurrence generation frozen: skip staging legacy song occurrence outputs"
        else
          git add data/song_occurrences.json
          git add data/song_prediction_snapshots.json
          git add data/public/event_song_occurrences_public.json
          git add data/public/event_songs_public.json
        fi
        python guard_git_large_files.py
        if git diff --cached --quiet; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        git commit -m "Run YouTube daily backfill"
        git push origin HEAD:main
        echo "changed=true" >> "$GITHUB_OUTPUT"

    - name: Report commit outcome
      run: |
        if [ "${{ steps.commit.outputs.changed }}" = "true" ]; then
          echo "Committed YouTube daily backfill results to main." >> "$GITHUB_STEP_SUMMARY"
        else
          echo "No data change from this YouTube daily backfill run." >> "$GITHUB_STEP_SUMMARY"
        fi
