name: odottar coverage benchmark

on:
  schedule:
    - cron: '15 22 * * 0' # Monday 07:15 JST
  workflow_dispatch:

concurrency:
  group: odottar-coverage-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fast-forward main
        run: git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Fetch raw odottar snapshot
        run: |
          curl --fail --location --retry 3 --max-time 60 \
            --user-agent 'Bonsuke coverage benchmark/1.0' \
            --dump-header "$RUNNER_TEMP/odottar-headers.txt" \
            --output "$RUNNER_TEMP/odottar-events.json" \
            https://odottar.com/events.json

      - name: Build coverage-only diff
        run: |
          FETCHED_AT="$(TZ=UTC date +%Y-%m-%dT%H:%M:%SZ)"
          python build_odottar_coverage_benchmark.py \
            --odottar-json "$RUNNER_TEMP/odottar-events.json" \
            --bonsuke-json data/public/events_public.json \
            --fetched-at "$FETCHED_AT"
          cat data/odottar_coverage_latest.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit benchmark metrics only
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/odottar_coverage_latest.json
          git add data/odottar_coverage_latest.md
          git add data/odottar_coverage_history.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update odottar coverage benchmark"
          git push origin HEAD:main

      - name: Upload raw benchmark evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: odottar-coverage-raw-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/odottar-events.json
            ${{ runner.temp }}/odottar-headers.txt
          if-no-files-found: error
          retention-days: 30
