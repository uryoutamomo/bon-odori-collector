name: bon-odori-send-mail

on:
  push:
    paths:
      - 'data/pending_mail.json'
  schedule:
    # GitHub schedule は SLA 無し（遅延・ドロップあり）。1日3回試みて冪等に動く設計。
    # pending_mail.json を送信後に削除するので、複数回起動しても二重送信しない。
    - cron: '23 9 * * *'   # 18:23 JST（第1トライ）
    - cron: '23 10 * * *'  # 19:23 JST（第2トライ）
    - cron: '23 11 * * *'  # 20:23 JST（第3トライ）
  workflow_dispatch:

concurrency:
  group: bon-odori-send-mail
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'

    - name: Send daily mail
      env:
        MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
        MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
        MAIL_TO: ${{ secrets.MAIL_TO }}
      run: python send_mail.py

    - name: Remove pending_mail.json after send
      run: |
        if [ -f data/pending_mail.json ]; then
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm data/pending_mail.json
          git commit -m "chore: メール送信完了 → pending_mail.json を削除"
          git push
          echo "[mail] pending_mail.json を削除・プッシュしました。"
        else
          echo "[mail] pending_mail.json なし。削除ステップをスキップ。"
        fi
