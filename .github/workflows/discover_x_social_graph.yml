name: bon-odori-discover-x-social-graph

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'X API follow graph exploration. Type DISCOVER X SOCIAL GRAPH'
        required: true
        type: string

concurrency:
  group: bon-odori-master-rdb
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'

    - name: Validate manual X graph confirmation
      env:
        CONFIRMATION: ${{ inputs.confirm }}
      run: |
        set -euo pipefail
        expected="DISCOVER X SOCIAL GRAPH"
        if [[ "$CONFIRMATION" != "$expected" ]]; then
          echo "This workflow spends X API quota to explore follow graph candidates."
          echo "Re-run with confirm='$expected'."
          exit 1
        fi

    - name: Discover X candidate accounts from follow graph
      env:
        TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
      run: python discover_x_social_graph.py

    - name: Commit and Push discovery data
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        [ -f data/x_social_graph.json ] && git add data/x_social_graph.json
        [ -f data/x_candidate_accounts.json ] && git add data/x_candidate_accounts.json
        git diff --cached --quiet || (git commit -m "Discover X candidate accounts from social graph" && git push)
