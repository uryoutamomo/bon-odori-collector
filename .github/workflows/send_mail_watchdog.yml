name: bon-odori-send-mail-watchdog

on:
  schedule:
    # 通常の18:23 JST実行後に未claim・claim済みの本文が残っていないか確認する。
    # GitHub scheduleの混雑を避けるため、毎時ちょうどではない時刻にする。
    - cron: '7 10 * * *' # 19:07 JST
  workflow_dispatch:

concurrency:
  group: bon-odori-send-mail-watchdog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Trigger mail workflow when a draft remains
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if [ -f data/sending_mail.json ]; then
          echo "[watchdog] sending_mail.json が残っています。前回送信の成否が曖昧なため、自動再送しません。"
          echo "[watchdog] Gmailの送信済みを確認し、送信済みなら削除、未送信ならpendingへ戻してください。"
          exit 1
        fi

        if [ ! -f data/pending_mail.json ]; then
          echo "[watchdog] pending_mail.json なし。保険起動は不要です。"
          exit 0
        fi

        echo "[watchdog] pending_mail.json が残っています。メール送信Workflowを起動します。"
        gh workflow run send_mail.yml --ref "$GITHUB_REF_NAME"
