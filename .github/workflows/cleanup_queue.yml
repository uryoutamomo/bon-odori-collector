name: cleanup-queue
# 🔎 裏取りキュー DB のテストゴミを一括アーカイブする使い捨て手動ワークフロー。
on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Archive all queue rows
        env:
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
        run: python cleanup_queue.py
