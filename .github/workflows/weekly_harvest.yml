name: weekly-harvest

on:
  schedule:
    # 毎週木曜 10:23 JST (UTC 01:23) に実行。GitHub schedule混雑回避のため0分を避ける。
    - cron: '23 1 * * 4'
  workflow_dispatch:
    inputs:
      days:
        description: '候補収穫の対象日数'
        required: false
        default: '7'
      apply_reviewed:
        description: 'レビュー済みJSONを legacy Notion-backed song/glossary flow へ反映する'
        required: false
        type: boolean
        default: false
      apply_dry_run:
        description: '反映時もdry-runにする'
        required: false
        type: boolean
        default: true

concurrency:
  group: bon-odori-master-rdb
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    env:
      HARVEST_DAYS: ${{ inputs.days || '7' }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Fast-forward main
      run: git pull --ff-only origin main

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Configure AWS credentials
      if: ${{ vars.AWS_ROLE_ARN != '' }}
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ vars.AWS_ROLE_ARN }}
        aws-region: ap-northeast-1

    - name: Fetch master RDB artifact
      if: ${{ vars.MASTER_DB_S3_BUCKET != '' }}
      env:
        MASTER_DB_S3_BUCKET: ${{ vars.MASTER_DB_S3_BUCKET }}
        MASTER_DB_S3_PREFIX: ${{ vars.MASTER_DB_S3_PREFIX || 'master-rdb' }}
        AWS_REGION: ap-northeast-1
      run: python master_db_s3_artifact.py fetch --overwrite

    - name: Refresh public events from master RDB
      run: |
        python export_public_events.py
        if python master_rdb_freeze_policy.py is-frozen legacy_song_occurrence_generation; then
          echo "[master-rdb] legacy song occurrence generation frozen: skip build_song_occurrences.py"
        else
          python build_song_occurrences.py
        fi
        python export_public_events.py
        python build_song_ocr_queue.py
        if python master_rdb_freeze_policy.py is-frozen legacy_song_occurrence_generation; then
          echo "[master-rdb] legacy song occurrence generation frozen: skip calibrate_song_predictions.py"
        else
          python calibrate_song_predictions.py
        fi
        python build_retrospective_harvest.py

    - name: Build weekly harvest candidates
      run: python build_weekly_harvest_candidates.py --days "$HARVEST_DAYS"

    - name: Triage song candidates in dry-run mode
      env:
        NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
      run: python triage_weekly_song_candidates.py --dry-run

    - name: Prepare review queues and summary
      run: python prepare_weekly_harvest_review.py

    - name: Sync weekly cost record
      env:
        NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
      run: python sync_weekly_costs.py --apply

    - name: Build term/co-occurrence review UI
      run: |
        python build_keyboard_review_ui.py \
          --input data/weekly_harvest_review_candidates.json \
          --rows-key rows \
          --out data/weekly_harvest_review_ui.html \
          --title '週次収穫レビュー（用語・共起）' \
          --term-field term \
          --category-field category \
          --summary-fields interpretation,type,confidence,evidence_count \
          --detail-fields reason,evidence_text,evidence_url \
          --source-field evidence \
          --key-fields term,category,type,evidence_url \
          --download-name weekly_harvest_review_decisions.json \
          --storage-key weekly-harvest-review

    - name: Build song review UI
      run: |
        python build_keyboard_review_ui.py \
          --input data/weekly_song_candidates_review.json \
          --rows-key rows \
          --out data/weekly_song_candidates_review_ui.html \
          --title '週次収穫レビュー（曲候補）' \
          --term-field term \
          --category-field category \
          --summary-fields canonical_song_name,triage_reason,evidence_count \
          --detail-fields reason,evidence_text,evidence_url \
          --source-field evidence \
          --key-fields term,category,type,evidence_url \
          --decisions-labels '曲として採用,曲ではない,分割,用語集へ,保留' \
          --download-name weekly_song_review_decisions.json \
          --storage-key weekly-song-review

    - name: Apply reviewed decisions when explicitly requested
      if: ${{ inputs.apply_reviewed == true }}
      env:
        NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
      run: |
        APPLY_FLAGS=""
        if [ "${{ inputs.apply_dry_run }}" != "false" ]; then
          APPLY_FLAGS="--dry-run"
        fi
        if [ -f data/weekly_song_review_decisions.json ]; then
          python apply_weekly_song_review_decisions.py \
            --source data/weekly_song_candidates_review.json \
            --decisions data/weekly_song_review_decisions.json \
            --out data/weekly_song_review_apply_result.json \
            $APPLY_FLAGS
        else
          echo "data/weekly_song_review_decisions.json not found; skip song apply"
        fi
        if [ -f data/weekly_harvest_review_decisions.json ]; then
          python apply_weekly_harvest_human13_decisions.py \
            --candidates data/weekly_harvest_review_candidates.json \
            --decisions data/weekly_harvest_review_decisions.json \
            --out data/weekly_harvest_apply_result.json \
            $APPLY_FLAGS
        else
          echo "data/weekly_harvest_review_decisions.json not found; skip term/co-occurrence apply"
        fi

    - name: Append GitHub summary
      run: cat data/weekly_harvest_summary.md >> "$GITHUB_STEP_SUMMARY"

    - name: Commit and Push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add data/weekly_harvest_candidates.json
        git add data/weekly_harvest_review_candidates.json
        git add data/weekly_harvest_review_ui.html
        git add data/weekly_harvest_summary.json
        git add data/weekly_harvest_summary.md
        git add data/weekly_cost_sync_result.json
        git add data/weekly_song_candidates_review.json
        git add data/weekly_song_candidates_review_ui.html
        git add data/weekly_song_triage_result.json
        [ -f data/weekly_song_review_apply_result.json ] && git add data/weekly_song_review_apply_result.json
        [ -f data/weekly_harvest_apply_result.json ] && git add data/weekly_harvest_apply_result.json
        [ -f data/venue_master.json ] && git add data/venue_master.json
        [ -f data/public/events_public.json ] && git add data/public/events_public.json
        if python master_rdb_freeze_policy.py is-frozen ph1_public_song_export_files; then
          echo "[master-rdb] Ph1 public song export files frozen: do not stage migrated public song files"
        else
          echo "[master-rdb] Ph1 public song export released; legacy song occurrence source remains frozen"
          [ -f data/public/event_song_occurrences_public.json ] && git add data/public/event_song_occurrences_public.json
          [ -f data/public/event_songs_public.json ] && git add data/public/event_songs_public.json
        fi
        if python master_rdb_freeze_policy.py is-frozen legacy_song_occurrence_generation; then
          echo "[master-rdb] legacy song occurrence generation frozen: do not stage legacy song occurrence generated files"
        else
          [ -f data/song_occurrences.json ] && git add data/song_occurrences.json
          [ -f data/song_prediction_snapshots.json ] && git add data/song_prediction_snapshots.json
          [ -f data/song_prediction_calibration.json ] && git add data/song_prediction_calibration.json
        fi
        [ -f data/song_ocr_queue.json ] && git add data/song_ocr_queue.json
        [ -f data/song_ocr_review.json ] && git add data/song_ocr_review.json
        [ -f data/song_evidence_manual.json ] && git add data/song_evidence_manual.json
        [ -f data/prediction_params.json ] && git add data/prediction_params.json
        [ -f data/retrospective_harvest_candidates.json ] && git add data/retrospective_harvest_candidates.json
        git diff --cached --quiet || (git commit -m "Update weekly harvest review queues" && git push)
