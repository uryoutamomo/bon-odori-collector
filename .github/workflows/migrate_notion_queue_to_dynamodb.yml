name: migrate-notion-queue-to-dynamodb

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Legacy one-off migration: write eligible Notion-only rows into DynamoDB"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      cutoff:
        description: "Legacy migration cutoff; only Notion rows created before this timestamp are considered"
        required: true
        default: "2026-06-07T00:00:00+09:00"

jobs:
  migrate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: Migrate legacy Notion queue rows
        env:
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          AWS_REGION: ap-northeast-1
          DYNAMODB_QUEUE_TABLE: ${{ vars.DYNAMODB_QUEUE_TABLE }}
        run: |
          if [ "${{ inputs.apply }}" = "true" ]; then
            python migrate_notion_queue_to_dynamodb.py --cutoff "${{ inputs.cutoff }}" --apply
          else
            python migrate_notion_queue_to_dynamodb.py --cutoff "${{ inputs.cutoff }}"
          fi
