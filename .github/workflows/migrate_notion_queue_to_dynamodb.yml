name: migrate-notion-queue-to-dynamodb

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Legacy one-off migration: write eligible Notion-only rows into DynamoDB"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      cutoff:
        description: "Legacy migration cutoff; only Notion rows created before this timestamp are considered"
        required: true
        default: "2026-06-07T00:00:00+09:00"
      confirm:
        description: "Type MIGRATE NOTION QUEUE TO DYNAMODB when apply=true"
        required: false
        default: ""
        type: string

jobs:
  migrate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: Validate migration confirmation
        env:
          APPLY: ${{ inputs.apply }}
          CONFIRMATION: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "$APPLY" != "true" ]; then
            echo "Dry-run mode; no confirmation required."
            exit 0
          fi
          expected="MIGRATE NOTION QUEUE TO DYNAMODB"
          if [ "$CONFIRMATION" != "$expected" ]; then
            echo "This legacy one-off workflow writes Notion queue rows into DynamoDB."
            echo "Re-run with confirm='$expected'."
            exit 1
          fi

      - name: Migrate legacy Notion queue rows
        env:
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          AWS_REGION: ap-northeast-1
          DYNAMODB_QUEUE_TABLE: ${{ vars.DYNAMODB_QUEUE_TABLE }}
        run: |
          if [ "${{ inputs.apply }}" = "true" ]; then
            python migrate_notion_queue_to_dynamodb.py --cutoff "${{ inputs.cutoff }}" --apply --confirm "${{ inputs.confirm }}"
          else
            python migrate_notion_queue_to_dynamodb.py --cutoff "${{ inputs.cutoff }}"
          fi
