name: Refresh specification index
on:
  push:
    branches: [main]
    paths: ["docs/spec/**", "scripts/spec_index.py"]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/spec_index.py build --out docs/spec/index.json
      - name: Commit refreshed index
        run: |
          git add docs/spec/index.json
          python guard_git_large_files.py
          git diff --cached --quiet || (git config user.name github-actions[bot] && git config user.email 41898282+github-actions[bot]@users.noreply.github.com && git commit -m "Refresh specification index" && git push)
