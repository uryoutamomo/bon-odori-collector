name: bon-odori-review-x-candidate-posts

on:
  workflow_dispatch:
    inputs:
      sync_only:
        description: '内田さん承認済み(user_approved=true)のpromoteだけ legacy Notion X member list へ同期（X API課金なし）'
        required: false
        type: boolean
        default: false
      confirm:
        description: '通常レビューは REVIEW X CANDIDATES、Notion同期は SYNC APPROVED X MEMBERS と入力'
        required: false
        type: string
        default: ""
  # 2026-07-26追加: 手動実行専用だったため 2026-06-09 を最後に47日間動かず、
  # 発見した候補が誰もレビューされないまま滞留していた。毎週火曜 6:30 JST に
  # 候補レビューだけ自動実行する（Notionメンバーリストへの昇格同期は、内田さんの
  # 承認済みだけを対象にする運用なので自動化しない）。
  # 2026-08-25 内田さん指示: 盆助のX収集を一旦休止。再開時は次の2行のコメントを外す。
  # schedule:
  #   - cron: '30 21 * * 1'

concurrency:
  group: bon-odori-master-rdb
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'

    - name: Validate manual X workflow confirmation
      if: ${{ github.event_name != 'schedule' }}
      env:
        SYNC_ONLY: ${{ inputs.sync_only }}
        CONFIRMATION: ${{ inputs.confirm }}
      run: |
        set -euo pipefail
        if [[ "$SYNC_ONLY" == "true" ]]; then
          expected="SYNC APPROVED X MEMBERS"
        else
          expected="REVIEW X CANDIDATES"
        fi
        if [[ "$CONFIRMATION" != "$expected" ]]; then
          echo "This workflow either spends X API quota or writes approved members to Notion."
          echo "Re-run with confirm='$expected'."
          exit 1
        fi

    - name: Review candidate accounts by recent posts
      if: ${{ !inputs.sync_only }}
      env:
        TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
        NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
      run: python review_x_candidate_posts.py

    - name: Sync saved promote results to Notion
      if: ${{ inputs.sync_only }}
      env:
        NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
      run: python sync_x_promoted_members.py

    - name: Commit and Push review data
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        [ -f data/x_candidate_post_review.json ] && git add data/x_candidate_post_review.json
        git diff --cached --quiet || (git commit -m "Review X candidate accounts by posts" && git push)
