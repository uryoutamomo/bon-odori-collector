name: bon-odori-collect

on:
  schedule:
    # 毎日15:00 JST (UTC 06:00) に実行
    - cron: '0 6 * * *'
  workflow_dispatch: # 手動実行ボタンも有効にする

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 実行結果をリポジトリに書き込むために必要

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Run collector
      env:
        NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
        NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
      run: python collect.py

    - name: Commit and Push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add data/latest.json data/seen.json data/voices.json data/voices_seen.json
        git diff --cached --quiet || (git commit -m "Update bon-odori data (news + voices)" && git push)
