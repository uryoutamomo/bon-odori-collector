name: bon-odori-collect

on:
  schedule:
    # 毎日 約15:13 JST (UTC 06:13) に実行。
    # 注: GitHub の schedule は SLA がなく、特に "0分"(毎時ちょうど)は世界中のジョブが
    # 集中して遅延・ドロップされやすい。混雑を避けるため意図的に分をずらしている。
    - cron: '13 6 * * *'
  workflow_dispatch:
    inputs:
      allow_notion_writes:
        description: 'legacy Notion log / queue / summary writesを許可する（通常false）'
        required: false
        type: boolean
        default: false
      run_detail_cleanup_repair:
        description: '一時job: 14件の公開detail重複をMaster RDBで修復する'
        required: false
        type: boolean
        default: false
      expected_remote_checksum:
        description: 'statusで確認済みのMaster RDB remote checksum（修復jobで必須）'
        required: false
        type: string
        default: ''
      expected_head_sha:
        description: 'merge済みmain上でこの一時jobを許可するhead SHA'
        required: false
        type: string
        default: ''
      confirm:
        description: '一時修復の確認文字列: APPLY DETAIL CLEANUP REPAIR 14'
        required: false
        type: string
        default: ''

concurrency:
  group: bon-odori-master-rdb
  cancel-in-progress: false

jobs:
  repair_public_detail_cleanup:
    # This is deliberately isolated from normal collection.  It exists only
    # for the 2026-08-16 repair and must be removed after its evidence is kept.
    # The OIDC trust policy permits only main; do not weaken it for this one-off repair.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_detail_cleanup_repair == true && github.repository == 'uryoutamomo/bon-odori-collector' && github.actor == 'uryoutamomo' && github.ref == 'refs/heads/main' && github.sha == inputs.expected_head_sha }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      MASTER_DB_S3_BUCKET: ${{ vars.MASTER_DB_S3_BUCKET }}
      MASTER_DB_S3_PREFIX: ${{ vars.MASTER_DB_S3_PREFIX || 'master-rdb' }}
      AWS_REGION: ap-northeast-1
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      EXPECTED_REMOTE_CHECKSUM: ${{ inputs.expected_remote_checksum }}
      EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
      REPAIR_CONFIRM: ${{ inputs.confirm }}
      REPAIR_REPORT: data/official_notice_reports/detail_cleanup_repair_20260816.json
      REPAIR_TARGET_YEAR: '2026'
      REPAIR_TODAY: '2026-08-16'

    steps:
    - name: Checkout dispatched branch without fast-forwarding main
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Validate repair dispatch inputs
      run: |
        test "$REPAIR_CONFIRM" = 'APPLY DETAIL CLEANUP REPAIR 14'
        test -n "$EXPECTED_REMOTE_CHECKSUM"
        test "$GITHUB_SHA" = "$EXPECTED_HEAD_SHA"
        test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
        test -n "$MASTER_DB_S3_BUCKET"
        test -n "$AWS_ROLE_ARN"
        # This must be the CloudFormation GitHubActionsRoleArn, not an arbitrary
        # repository variable that happens to be an IAM role.
        test "$AWS_ROLE_ARN" = 'arn:aws:iam::169805602203:role/bon-odori-collector-queue'

    - name: Configure AWS credentials through GitHub OIDC
      uses: aws-actions/configure-aws-credentials@451ce2a72e8d729a59ebeaacab82dbce58e7af4c # v6
      with:
        role-to-assume: ${{ env.AWS_ROLE_ARN }}
        aws-region: ap-northeast-1

    - name: Fetch and pin the exact Master RDB baseline
      run: |
        python master_db_s3_artifact.py status > "$RUNNER_TEMP/master-rdb-status-before.txt"
        cat "$RUNNER_TEMP/master-rdb-status-before.txt"
        python master_db_s3_artifact.py fetch --overwrite
        RSTART="$(python -c 'import json; print(json.load(open("data/bon_odori_master_manifest.json"))["database_checksum"])')"
        test "$RSTART" = "$EXPECTED_REMOTE_CHECKSUM"
        echo "RSTART=$RSTART" >> "$GITHUB_ENV"
        echo "remote checksum: $RSTART" >> "$GITHUB_STEP_SUMMARY"
        cp data/bon_odori_master.sqlite "$RUNNER_TEMP/detail-cleanup-before.sqlite"
        python scripts/export_detail_cleanup_projection.py \
          --db "$RUNNER_TEMP/detail-cleanup-before.sqlite" \
          --events-out "$RUNNER_TEMP/detail-cleanup-public-before.json" \
          --source-map-out "$RUNNER_TEMP/detail-cleanup-public-before-source-map.json" \
          --target-year "$REPAIR_TARGET_YEAR" --today "$REPAIR_TODAY"

    - name: Dry-run the 14 detail replacements
      run: |
        python -m report_apply.apply_detail_cleanup_repair \
          --report "$REPAIR_REPORT" \
          --master-db data/bon_odori_master.sqlite \
          --out-db "$RUNNER_TEMP/detail-cleanup-preview.sqlite" \
          --out-json "$RUNNER_TEMP/detail-cleanup-dry-run.json" \
          --out-md "$RUNNER_TEMP/detail-cleanup-dry-run.md"
        python scripts/export_detail_cleanup_projection.py \
          --db "$RUNNER_TEMP/detail-cleanup-preview.sqlite" \
          --events-out "$RUNNER_TEMP/detail-cleanup-public-preview.json" \
          --source-map-out "$RUNNER_TEMP/detail-cleanup-public-preview-source-map.json" \
          --target-year "$REPAIR_TARGET_YEAR" --today "$REPAIR_TODAY"
        python scripts/verify_detail_cleanup_repair.py \
          --before "$RUNNER_TEMP/detail-cleanup-before.sqlite" \
          --after "$RUNNER_TEMP/detail-cleanup-preview.sqlite" \
          --report "$REPAIR_REPORT" \
          --apply-report "$RUNNER_TEMP/detail-cleanup-dry-run.json" \
          --public-before "$RUNNER_TEMP/detail-cleanup-public-before.json" \
          --public-after "$RUNNER_TEMP/detail-cleanup-public-preview.json" \
          --public-before-source-map "$RUNNER_TEMP/detail-cleanup-public-before-source-map.json" \
          --public-after-source-map "$RUNNER_TEMP/detail-cleanup-public-preview-source-map.json" \
          --out "$RUNNER_TEMP/detail-cleanup-dry-run-verify.json"

    - name: Apply only after the bounded dry-run passes
      run: |
        python -m report_apply.apply_detail_cleanup_repair \
          --report "$REPAIR_REPORT" \
          --master-db data/bon_odori_master.sqlite \
          --out-json "$RUNNER_TEMP/detail-cleanup-apply.json" \
          --out-md "$RUNNER_TEMP/detail-cleanup-apply.md" \
          --apply \
          --confirm "$REPAIR_CONFIRM"
        python scripts/export_detail_cleanup_projection.py \
          --db data/bon_odori_master.sqlite \
          --events-out "$RUNNER_TEMP/detail-cleanup-public-apply.json" \
          --source-map-out "$RUNNER_TEMP/detail-cleanup-public-apply-source-map.json" \
          --target-year "$REPAIR_TARGET_YEAR" --today "$REPAIR_TODAY"
        python scripts/verify_detail_cleanup_repair.py \
          --before "$RUNNER_TEMP/detail-cleanup-before.sqlite" \
          --after data/bon_odori_master.sqlite \
          --report "$REPAIR_REPORT" \
          --apply-report "$RUNNER_TEMP/detail-cleanup-apply.json" \
          --public-before "$RUNNER_TEMP/detail-cleanup-public-before.json" \
          --public-after "$RUNNER_TEMP/detail-cleanup-public-apply.json" \
          --public-before-source-map "$RUNNER_TEMP/detail-cleanup-public-before-source-map.json" \
          --public-after-source-map "$RUNNER_TEMP/detail-cleanup-public-apply-source-map.json" \
          --out "$RUNNER_TEMP/detail-cleanup-apply-verify.json"

    - name: Publish the verified repair with compare-and-swap
      run: |
        python master_db_s3_artifact.py publish \
          --expect-remote-checksum "$RSTART" \
          --snapshot-id "detail-cleanup-repair-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
          > "$RUNNER_TEMP/detail-cleanup-publish.txt"
        cat "$RUNNER_TEMP/detail-cleanup-publish.txt"

    - name: Fetch and verify the published Master RDB
      run: |
        python master_db_s3_artifact.py fetch --overwrite
        python audit_master_rdb.py \
          --out-json "$RUNNER_TEMP/detail-cleanup-post-fetch-audit.json" \
          --out-md "$RUNNER_TEMP/detail-cleanup-post-fetch-audit.md"
        python -c 'import json, sys; report=json.load(open(sys.argv[1])); assert report.get("issue_count") == 0, report' "$RUNNER_TEMP/detail-cleanup-post-fetch-audit.json"
        python scripts/export_detail_cleanup_projection.py \
          --db data/bon_odori_master.sqlite \
          --events-out "$RUNNER_TEMP/detail-cleanup-public-post-fetch.json" \
          --source-map-out "$RUNNER_TEMP/detail-cleanup-public-post-fetch-source-map.json" \
          --target-year "$REPAIR_TARGET_YEAR" --today "$REPAIR_TODAY"
        python scripts/verify_detail_cleanup_repair.py \
          --before "$RUNNER_TEMP/detail-cleanup-before.sqlite" \
          --after data/bon_odori_master.sqlite \
          --report "$REPAIR_REPORT" \
          --public-before "$RUNNER_TEMP/detail-cleanup-public-before.json" \
          --public-after "$RUNNER_TEMP/detail-cleanup-public-post-fetch.json" \
          --public-before-source-map "$RUNNER_TEMP/detail-cleanup-public-before-source-map.json" \
          --public-after-source-map "$RUNNER_TEMP/detail-cleanup-public-post-fetch-source-map.json" \
          --audit-report "$RUNNER_TEMP/detail-cleanup-post-fetch-audit.json" \
          --out "$RUNNER_TEMP/detail-cleanup-post-fetch-verify.json"

    - name: Summarize bounded repair evidence
      if: ${{ always() }}
      run: |
        echo '## 14件detail cleanup repair' >> "$GITHUB_STEP_SUMMARY"
        echo '- `expected_head_sha` は誤dispatchを防ぐ運用上の照合値であり、単独の認可境界ではない。branch/actor/OIDC role の制約と併用する。main protection/Environment はこの一時修復の追加範囲外なので、実行直前にmain SHAを独立照合する。' >> "$GITHUB_STEP_SUMMARY"
        for file in "$RUNNER_TEMP"/detail-cleanup-*-verify.json; do
          [ -f "$file" ] && cat "$file" >> "$GITHUB_STEP_SUMMARY"
        done

    - name: Upload bounded repair evidence
      if: ${{ always() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: detail-cleanup-repair-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          ${{ runner.temp }}/master-rdb-status-before.txt
          ${{ runner.temp }}/detail-cleanup-*.json
          ${{ runner.temp }}/detail-cleanup-*.md
          ${{ runner.temp }}/detail-cleanup-publish.txt
        if-no-files-found: warn
        retention-days: 30

  build:
    if: ${{ inputs.run_detail_cleanup_repair != true }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # 実行結果をリポジトリに書き込むために必要
      id-token: write # AWS OIDC の短期認証トークン発行に必要

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Fast-forward main
      run: git pull --ff-only origin main

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Configure AWS credentials
      if: ${{ vars.AWS_ROLE_ARN != '' }}
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ vars.AWS_ROLE_ARN }}
        aws-region: ap-northeast-1

    - name: Fetch voices artifact
      env:
        VOICES_S3_BUCKET: ${{ vars.VOICES_S3_BUCKET }}
        VOICES_S3_PREFIX: ${{ vars.VOICES_S3_PREFIX || 'voices' }}
        AWS_REGION: ap-northeast-1
      run: python voices_s3_artifact.py fetch --overwrite

    - name: Fetch master RDB artifact
      if: ${{ vars.MASTER_DB_S3_BUCKET != '' }}
      env:
        MASTER_DB_S3_BUCKET: ${{ vars.MASTER_DB_S3_BUCKET }}
        MASTER_DB_S3_PREFIX: ${{ vars.MASTER_DB_S3_PREFIX || 'master-rdb' }}
        AWS_REGION: ap-northeast-1
      run: python master_db_s3_artifact.py fetch --overwrite

    - name: Audit fetched master RDB
      if: ${{ vars.MASTER_DB_S3_BUCKET != '' }}
      run: |
        python audit_master_rdb.py \
          --out-json "$RUNNER_TEMP/master_rdb_audit.json" \
          --out-md "$RUNNER_TEMP/master_rdb_audit.md" \
          --append-github-summary

    - name: Build glossary runtime
      env:
        NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
      run: python build_glossary_runtime.py

    # Event/venue aliases live in the master RDB; matching paths read the
    # runtime file this step regenerates.  Without the RDB it keeps the
    # committed file as-is instead of emptying it.
    - name: Build event alias runtime
      run: python build_event_alias_runtime.py

    - name: Sync canonical event-state axes to master RDB
      id: event_state_axes
      if: ${{ vars.EVENT_STATE_AXES_ENABLED == 'true' && vars.MASTER_DB_S3_BUCKET != '' }}
      env:
        MASTER_DB_S3_BUCKET: ${{ vars.MASTER_DB_S3_BUCKET }}
        MASTER_DB_S3_PREFIX: ${{ vars.MASTER_DB_S3_PREFIX || 'master-rdb' }}
        AWS_REGION: ap-northeast-1
      run: |
        TODAY="$(TZ=Asia/Tokyo date +%F)"
        TARGET_YEAR="${TODAY%%-*}"
        RSTART="$(python -c 'import json; print(json.load(open("data/bon_odori_master_manifest.json"))["database_checksum"])')"
        python run_event_state_axes_migration.py \
          --db data/bon_odori_master.sqlite \
          --derive-from-db \
          --today "$TODAY" \
          --target-year "$TARGET_YEAR" \
          --execute \
          --confirm 'MIGRATE EVENT STATE AXES' \
          --report-out "$RUNNER_TEMP/event-state-axes-migration.json"
        python audit_master_rdb.py \
          --out-json "$RUNNER_TEMP/event-state-axes-audit.json" \
          --out-md "$RUNNER_TEMP/event-state-axes-audit.md"
        LOCAL_SHA="$(python -c 'from master_rdb.master_db import file_sha256; print(file_sha256("data/bon_odori_master.sqlite"))')"
        if [ "$LOCAL_SHA" != "$RSTART" ]; then
          python master_db_s3_artifact.py publish \
            --expect-remote-checksum "$RSTART" \
            --snapshot-id "event-state-axes-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "published=true" >> "$GITHUB_OUTPUT"
        else
          echo "[event-state-axes] canonical axes already current; skip S3 publish"
          echo "published=false" >> "$GITHUB_OUTPUT"
        fi
        python master_db_s3_artifact.py fetch --overwrite
        python run_event_state_axes_migration.py \
          --db data/bon_odori_master.sqlite \
          --derive-from-db \
          --today "$TODAY" \
          --target-year "$TARGET_YEAR" \
          --report-out "$RUNNER_TEMP/event-state-axes-rend.json"
        echo "ran=true" >> "$GITHUB_OUTPUT"

    - name: Transition ended confirmed occurrences
      id: ended_occurrences
      if: ${{ vars.ENDED_TRANSITION_ENABLED == 'true' && vars.EVENT_STATE_AXES_ENABLED == 'true' && vars.MASTER_DB_S3_BUCKET != '' }}
      env:
        MASTER_DB_S3_BUCKET: ${{ vars.MASTER_DB_S3_BUCKET }}
        MASTER_DB_S3_PREFIX: ${{ vars.MASTER_DB_S3_PREFIX || 'master-rdb' }}
        AWS_REGION: ap-northeast-1
      run: |
        TODAY="$(TZ=Asia/Tokyo date +%F)"
        RSTART="$(python -c 'import json; print(json.load(open("data/bon_odori_master_manifest.json"))["database_checksum"])')"
        python transition_ended_occurrences.py \
          --db data/bon_odori_master.sqlite \
          --as-of-date "$TODAY" \
          --apply \
          --confirm 'TRANSITION ENDED OCCURRENCES' \
          --report-out "$RUNNER_TEMP/ended-occurrence-transition.json"
        COUNT="$(python -c 'import json, sys; print(json.load(open(sys.argv[1]))["count"])' "$RUNNER_TEMP/ended-occurrence-transition.json")"
        if [ "$COUNT" -gt 0 ]; then
          python audit_master_rdb.py \
            --out-json "$RUNNER_TEMP/ended-occurrence-audit.json" \
            --out-md "$RUNNER_TEMP/ended-occurrence-audit.md"
          python master_db_s3_artifact.py publish \
            --expect-remote-checksum "$RSTART" \
            --snapshot-id "ended-occurrences-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python master_db_s3_artifact.py fetch --overwrite
          echo "published=true" >> "$GITHUB_OUTPUT"
        else
          echo "[ended-occurrences] no completed confirmed occurrences to transition"
          echo "published=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Upload event-state axes evidence
      if: ${{ always() && vars.EVENT_STATE_AXES_ENABLED == 'true' && vars.MASTER_DB_S3_BUCKET != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: event-state-axes-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          ${{ runner.temp }}/event-state-axes-migration.json
          ${{ runner.temp }}/event-state-axes-audit.json
          ${{ runner.temp }}/event-state-axes-audit.md
          ${{ runner.temp }}/event-state-axes-rend.json
          ${{ runner.temp }}/ended-occurrence-transition.json
          ${{ runner.temp }}/ended-occurrence-audit.json
          ${{ runner.temp }}/ended-occurrence-audit.md
        if-no-files-found: error
        retention-days: 30

    - name: Run collector
      env:
        NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
        # X(twitterapi.io)収集用。未設定でも collect.py 側で fail-safe スキップする
        TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
        # Xの未判定生データは公開物と分離したS3へ先に保存する。キー未設定時は
        # 新規X投稿を見つけた段階で停止し、voices_seen を進めない。
        X_RAW_POSTS_S3_BUCKET: ${{ vars.X_RAW_POSTS_S3_BUCKET }}
        X_RAW_POSTS_S3_PREFIX: ${{ vars.X_RAW_POSTS_S3_PREFIX || 'x-raw' }}
        # 📖 盆踊ラー用語集 DB（速報・確度シグナル検知に使用）。未設定でも fail-safe スキップ
        GLOSSARY_DB_ID: ${{ secrets.GLOSSARY_DB_ID }}
        # 通常の日次収集はNotionへ書かない。手動実行時だけ明示的にtrueへできる。
        COLLECT_ALLOW_NOTION_WRITES: ${{ inputs.allow_notion_writes || false }}
        AWS_REGION: ap-northeast-1
        DYNAMODB_QUEUE_TABLE: ${{ vars.DYNAMODB_QUEUE_TABLE }}
        EVENT_CANDIDATE_QUEUE_TABLE: ${{ vars.EVENT_CANDIDATE_QUEUE_TABLE }}
        QUEUE_STORAGE_MODE: ${{ vars.QUEUE_STORAGE_MODE || 'dynamodb' }}
        EVENT_QUEUE_STORAGE_MODE: ${{ vars.EVENT_QUEUE_STORAGE_MODE || vars.QUEUE_STORAGE_MODE || 'dynamodb' }}
        X_COLLECTION_HEALTH_REPORT: ${{ runner.temp }}/x-collection-health.json
      run: python collect.py

    - name: Collect official venue sites (direct monitoring)
      run: python collect_venue_sites.py

    - name: Refresh public event export and daily X harvest
      env:
        NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
      run: |
        TODAY="$(TZ=Asia/Tokyo date +%F)"
        TARGET_YEAR="${TODAY%%-*}"
        python export_public_events.py --target-year "$TARGET_YEAR" --today "$TODAY"
        if python master_rdb_freeze_policy.py is-frozen legacy_song_occurrence_generation; then
          echo "[master-rdb] legacy song occurrence generation frozen: skip build_song_occurrences.py"
        else
          python build_song_occurrences.py
        fi
        python export_public_events.py --target-year "$TARGET_YEAR" --today "$TODAY"
        python build_event_song_candidates.py
        python build_x_news_digest_for_oto.py
        # The digest remains a research artifact.  The only machine-selected
        # X input permitted to enter the review path is this bounded,
        # gap-driven queue (max 30/day).
        python build_x_gap_candidates.py --limit 30
        python review_inbox_adapters/x_gap_adapter.py \
          --input data/x_gap_candidates.json \
          --output data/review_inbox_adapted/x_gap.json
        python build_x_review_lanes.py --input data/x_gap_candidates.json
        if [ -f data/x_news_digest_oto_reviews.json ]; then
          python promote_x_news_digest_reviews.py
          python build_rare_signal_backcheck_queue.py
          touch "$RUNNER_TEMP/rare-signal-backcheck-built"
          if [ -f data/review_console/staged/rare_signal_backcheck_decisions.json ]; then
            python export_rare_signal_backcheck_reviews.py
          fi
          if [ -f data/rare_signal_backcheck_reviews.json ]; then
            python stage_rare_signal_backcheck_reviews.py
          else
            echo "[rare-signal] no backcheck review file; skip registration staging"
          fi
        else
          echo "[x-news-digest] no Oto review file; skip rare_signal promotion"
        fi
        python build_event_poster_ocr_queue.py
        python build_x_account_console.py
        python build_song_ocr_queue.py
        if python master_rdb_freeze_policy.py is-frozen legacy_song_occurrence_generation; then
          echo "[master-rdb] legacy song occurrence generation frozen: skip calibrate_song_predictions.py"
        else
          python calibrate_song_predictions.py
        fi
        python build_retrospective_harvest.py
        python build_weekly_harvest_candidates.py --days 3
        python triage_weekly_song_candidates.py --dry-run
        python prepare_weekly_harvest_review.py

    - name: Publish voices artifact
      env:
        VOICES_S3_BUCKET: ${{ vars.VOICES_S3_BUCKET }}
        VOICES_S3_PREFIX: ${{ vars.VOICES_S3_PREFIX || 'voices' }}
        AWS_REGION: ap-northeast-1
      run: python voices_s3_artifact.py publish

    - name: Commit and Push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add data/latest.json data/seen.json data/voices_seen.json
        [ -f data/x_official_source_accounts.json ] && git add -f data/x_official_source_accounts.json
        [ -f data/venue_master.json ] && git add data/venue_master.json
        [ -f data/event_date_update_candidates.json ] && git add data/event_date_update_candidates.json
        [ -f data/event_song_candidates.json ] && git add data/event_song_candidates.json
        [ -f data/x_news_digest_for_oto.json ] && git add -f data/x_news_digest_for_oto.json
        [ -f data/x_news_digest_for_oto.md ] && git add -f data/x_news_digest_for_oto.md
        [ -f data/x_news_digest_oto_reviews.json ] && git add -f data/x_news_digest_oto_reviews.json
        [ -f data/x_gap_candidates.json ] && git add -f data/x_gap_candidates.json
        [ -f data/review_inbox_adapted/x_gap.json ] && git add -f data/review_inbox_adapted/x_gap.json
        [ -f data/x_review_lanes.json ] && git add -f data/x_review_lanes.json
        [ -f data/rare_signal_candidates.json ] && git add -f data/rare_signal_candidates.json
        [ -f data/rare_signal_candidates.md ] && git add -f data/rare_signal_candidates.md
        [ -f data/rare_signal_backcheck_reviews.json ] && git add -f data/rare_signal_backcheck_reviews.json
        [ -f data/rare_signal_backcheck_reviews.md ] && git add -f data/rare_signal_backcheck_reviews.md
        [ -f data/rare_signal_registration_candidates.json ] && git add -f data/rare_signal_registration_candidates.json
        [ -f data/rare_signal_registration_candidates.md ] && git add -f data/rare_signal_registration_candidates.md
        [ -f data/weekly_harvest_candidates.json ] && git add data/weekly_harvest_candidates.json
        [ -f data/weekly_harvest_summary.json ] && git add data/weekly_harvest_summary.json
        [ -f data/weekly_harvest_summary.md ] && git add data/weekly_harvest_summary.md
        [ -f data/weekly_song_triage_result.json ] && git add data/weekly_song_triage_result.json
        [ -f data/event_poster_ocr_queue.json ] && git add data/event_poster_ocr_queue.json
        [ -f data/poster_ocr_processed.json ] && git add data/poster_ocr_processed.json
        [ -f data/x_account_console.json ] && git add data/x_account_console.json
        [ -f data/x_collection_roster.json ] && git add data/x_collection_roster.json
        [ -f data/glossary_runtime.json ] && git add data/glossary_runtime.json
        [ -f data/event_alias_runtime.json ] && git add data/event_alias_runtime.json
        [ -f data/public/events_public.json ] && git add data/public/events_public.json
        [ -f data/public_event_source_map.json ] && git add data/public_event_source_map.json
        if python master_rdb_freeze_policy.py is-frozen ph1_public_song_export_files; then
          echo "[master-rdb] Ph1 public song export files frozen: do not stage migrated public song files"
        else
          echo "[master-rdb] Ph1 public song export released; legacy song occurrence source remains frozen"
          [ -f data/public/event_song_occurrences_public.json ] && git add data/public/event_song_occurrences_public.json
          [ -f data/public/event_songs_public.json ] && git add data/public/event_songs_public.json
        fi
        if python master_rdb_freeze_policy.py is-frozen legacy_song_occurrence_generation; then
          echo "[master-rdb] legacy song occurrence generation frozen: do not stage legacy song occurrence generated files"
        else
          [ -f data/song_occurrences.json ] && git add data/song_occurrences.json
          [ -f data/song_prediction_snapshots.json ] && git add data/song_prediction_snapshots.json
          [ -f data/song_prediction_calibration.json ] && git add data/song_prediction_calibration.json
        fi
        [ -f data/song_ocr_queue.json ] && git add data/song_ocr_queue.json
        [ -f data/song_ocr_review.json ] && git add data/song_ocr_review.json
        [ -f data/song_evidence_manual.json ] && git add data/song_evidence_manual.json
        [ -f data/prediction_params.json ] && git add data/prediction_params.json
        [ -f data/retrospective_harvest_candidates.json ] && git add data/retrospective_harvest_candidates.json
        [ -f data/x_budget.json ] && git add data/x_budget.json
        [ -f data/x_account_scores.json ] && git add data/x_account_scores.json
        [ -f data/proactive_event_report.json ] && git add data/proactive_event_report.json
        [ -f data/proactive_search_state.json ] && git add data/proactive_search_state.json
        [ -f data/torimochi_queue_seen.json ] && git add data/torimochi_queue_seen.json
        [ -f data/x_whitelist_state.json ] && git add data/x_whitelist_state.json
        # 検索クエリの読み取り位置。残らないと毎回初回扱いになり、既読分の課金が復活する。
        [ -f data/x_query_watermarks.json ] && git add data/x_query_watermarks.json
        # 経路別の費用と成果。2026-08-12に台帳を作ったが add 漏れで1件も残っていなかった。
        [ -f data/x_cost_ledger.json ] && git add data/x_cost_ledger.json
        [ -f data/x_event_evidence_state.json ] && git add data/x_event_evidence_state.json
        [ -f data/x_event_evidence_cohort.json ] && git add data/x_event_evidence_cohort.json
        python guard_git_large_files.py
        git diff --cached --quiet || (git commit -m "Update bon-odori data (news + voices + event dates)" && git push)

    - name: Dual-write rare signal queue to review inbox
      id: rare_signal_inbox
      if: ${{ vars.REVIEW_INBOX_RARE_SIGNAL_DUAL_WRITE_ENABLED == 'true' && vars.MASTER_DB_S3_BUCKET != '' }}
      env:
        MASTER_DB_S3_BUCKET: ${{ vars.MASTER_DB_S3_BUCKET }}
        MASTER_DB_S3_PREFIX: ${{ vars.MASTER_DB_S3_PREFIX || 'master-rdb' }}
        AWS_REGION: ap-northeast-1
        REVIEW_INBOX_RARE_SIGNAL_SCHEDULED_ENABLED: 'true'
        REVIEW_INBOX_DUAL_WRITE_MODE: bulk
        REVIEW_INBOX_CAS_PUBLISH_ENABLED: 'true'
        REVIEW_INBOX_READER_MODE: inbox
        REVIEW_INBOX_LEGACY_WRITER_ENABLED: 'false'
        # 日次cronのジョブ内での実行であることを明示する。
        # GitHubのスケジュール遅延で起動が17:20-18:00 JSTに入ると、
        # cronを守るためのガードにcron自身が弾かれるため。
        REVIEW_INBOX_CRON_SERIALIZED_RUN: 'true'
      run: |
        if [ ! -f "$RUNNER_TEMP/rare-signal-backcheck-built" ]; then
          echo "[review-inbox] current run did not build a rare signal queue; skip dual-write"
          echo "ran=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        TODAY="$(TZ=Asia/Tokyo date +%F)"
        TARGET_YEAR="${TODAY%%-*}"
        python run_review_inbox_rare_signal_scheduled.py \
          --execute \
          --confirm 'RUN SCHEDULED RARE SIGNAL DUAL WRITE' \
          --input data/rare_signal_backcheck_queue.json \
          --snapshot-out "$RUNNER_TEMP/rare-signal-inbox-snapshot.json" \
          --report-out "$RUNNER_TEMP/rare-signal-inbox-report.json" \
          --observation-id "github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
          --public-target-year "$TARGET_YEAR" \
          --public-today "$TODAY"
        python master_db_s3_artifact.py fetch --overwrite
        python review_inbox.py --out-json data/review_inbox.json --status pending
        echo "ran=true" >> "$GITHUB_OUTPUT"

    - name: Commit rare signal inbox projection
      if: ${{ steps.rare_signal_inbox.outputs.ran == 'true' }}
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add -f data/review_inbox.json
        python guard_git_large_files.py
        git diff --cached --quiet || (git commit -m "Update rare signal review inbox" && git push)

    - name: Upload rare signal inbox evidence
      if: ${{ always() && vars.REVIEW_INBOX_RARE_SIGNAL_DUAL_WRITE_ENABLED == 'true' && vars.MASTER_DB_S3_BUCKET != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: rare-signal-inbox-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          ${{ runner.temp }}/rare-signal-inbox-snapshot.json
          ${{ runner.temp }}/rare-signal-inbox-report.json
        if-no-files-found: warn
        retention-days: 30

    - name: Build YouTube review-inbox adapter inputs
      id: youtube_inputs
      if: ${{ vars.REVIEW_INBOX_YOUTUBE_AGGREGATE_DUAL_WRITE_ENABLED == 'true' && vars.MASTER_DB_S3_BUCKET != '' }}
      run: |
        python build_youtube_active_video_review.py --max-per-channel 10000
        python build_youtube_year_backfill_review_queue.py
        echo "built=true" >> "$GITHUB_OUTPUT"

    - name: Dual-write complete YouTube aggregate to review inbox
      id: youtube_aggregate_inbox
      if: ${{ steps.youtube_inputs.outputs.built == 'true' }}
      env:
        MASTER_DB_S3_BUCKET: ${{ vars.MASTER_DB_S3_BUCKET }}
        MASTER_DB_S3_PREFIX: ${{ vars.MASTER_DB_S3_PREFIX || 'master-rdb' }}
        AWS_REGION: ap-northeast-1
        REVIEW_INBOX_YOUTUBE_AGGREGATE_SCHEDULED_ENABLED: 'true'
        REVIEW_INBOX_DUAL_WRITE_MODE: bulk
        REVIEW_INBOX_CAS_PUBLISH_ENABLED: 'true'
        REVIEW_INBOX_READER_MODE: inbox
        REVIEW_INBOX_LEGACY_WRITER_ENABLED: 'false'
        # 日次cronのジョブ内での実行であることを明示する。
        # GitHubのスケジュール遅延で起動が17:20-18:00 JSTに入ると、
        # cronを守るためのガードにcron自身が弾かれるため。
        REVIEW_INBOX_CRON_SERIALIZED_RUN: 'true'
      run: |
        TODAY="$(TZ=Asia/Tokyo date +%F)"
        TARGET_YEAR="${TODAY%%-*}"
        python run_review_inbox_youtube_scheduled.py \
          --execute \
          --confirm 'RUN SCHEDULED YOUTUBE AGGREGATE DUAL WRITE' \
          --active-input data/youtube_active_video_review.json \
          --year-input data/youtube_year_backfill_review_queue.json \
          --user-input data/youtube_user_confirmation_queue.json \
          --snapshot-out "$RUNNER_TEMP/youtube-aggregate-inbox-snapshot.json" \
          --report-out "$RUNNER_TEMP/youtube-aggregate-inbox-report.json" \
          --observation-id "github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
          --public-target-year "$TARGET_YEAR" \
          --public-today "$TODAY"
        python master_db_s3_artifact.py fetch --overwrite
        python review_inbox.py --out-json data/review_inbox.json --status pending
        echo "ran=true" >> "$GITHUB_OUTPUT"

    - name: Commit YouTube aggregate inbox projection
      if: ${{ steps.youtube_aggregate_inbox.outputs.ran == 'true' }}
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add -f data/review_inbox.json
        python guard_git_large_files.py
        git diff --cached --quiet || (git commit -m "Update YouTube aggregate review inbox" && git push)

    - name: Upload YouTube aggregate inbox evidence
      if: ${{ always() && vars.REVIEW_INBOX_YOUTUBE_AGGREGATE_DUAL_WRITE_ENABLED == 'true' && vars.MASTER_DB_S3_BUCKET != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: youtube-aggregate-inbox-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          ${{ runner.temp }}/youtube-aggregate-inbox-snapshot.json
          ${{ runner.temp }}/youtube-aggregate-inbox-report.json
        if-no-files-found: warn
        retention-days: 30

    - name: Build low-priority review-inbox adapter inputs
      id: low_priority_inputs
      if: ${{ vars.REVIEW_INBOX_LOW_PRIORITY_DUAL_WRITE_ENABLED == 'true' && vars.MASTER_DB_S3_BUCKET != '' }}
      run: |
        python build_missing_venue_review_from_song_associations.py
        python build_historical_reference_quality_review.py
        echo "built=true" >> "$GITHUB_OUTPUT"

    - name: Dual-write low-priority queues to review inbox
      id: low_priority_inbox
      if: ${{ steps.low_priority_inputs.outputs.built == 'true' }}
      env:
        MASTER_DB_S3_BUCKET: ${{ vars.MASTER_DB_S3_BUCKET }}
        MASTER_DB_S3_PREFIX: ${{ vars.MASTER_DB_S3_PREFIX || 'master-rdb' }}
        AWS_REGION: ap-northeast-1
        REVIEW_INBOX_LOW_PRIORITY_SCHEDULED_ENABLED: 'true'
        REVIEW_INBOX_DUAL_WRITE_MODE: bulk
        REVIEW_INBOX_CAS_PUBLISH_ENABLED: 'true'
        REVIEW_INBOX_READER_MODE: inbox
        REVIEW_INBOX_LEGACY_WRITER_ENABLED: 'false'
        # 日次cronのジョブ内での実行であることを明示する。
        # GitHubのスケジュール遅延で起動が17:20-18:00 JSTに入ると、
        # cronを守るためのガードにcron自身が弾かれるため。
        REVIEW_INBOX_CRON_SERIALIZED_RUN: 'true'
      run: |
        TODAY="$(TZ=Asia/Tokyo date +%F)"
        TARGET_YEAR="${TODAY%%-*}"
        python run_review_inbox_low_priority_scheduled.py \
          --execute --confirm 'RUN SCHEDULED LOW PRIORITY DUAL WRITE' \
          --source daily_song_candidate=data/weekly_song_candidates_review.json \
          --source daily_term_candidate=data/weekly_harvest_review_candidates.json \
          --source accepted_venue_song_missing_venue=data/accepted_venue_song_missing_venue_review.json \
          --source historical_reference_quality=data/historical_reference_quality_review.json \
          --source publication_gap=data/publication_gap_review.json \
          --evidence-dir "$RUNNER_TEMP/low-priority-inbox" \
          --observation-id "github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
          --public-target-year "$TARGET_YEAR" \
          --public-today "$TODAY"
        python master_db_s3_artifact.py fetch --overwrite
        python review_inbox.py --out-json data/review_inbox.json --status pending
        echo "ran=true" >> "$GITHUB_OUTPUT"

    - name: Commit low-priority inbox projection
      if: ${{ steps.low_priority_inbox.outputs.ran == 'true' }}
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add -f data/review_inbox.json
        python guard_git_large_files.py
        git diff --cached --quiet || (git commit -m "Update low-priority review inbox" && git push)

    - name: Upload low-priority inbox evidence
      if: ${{ always() && vars.REVIEW_INBOX_LOW_PRIORITY_DUAL_WRITE_ENABLED == 'true' && vars.MASTER_DB_S3_BUCKET != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: low-priority-inbox-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/low-priority-inbox
        if-no-files-found: warn
        retention-days: 30

    # Keep this as the final job step: X outages must not prevent the current
    # run's exports, artifact publishes, and guarded commits from completing.
    - name: Enforce X collection health
      if: ${{ always() }}
      env:
        X_COLLECTION_HEALTH_REPORT: ${{ runner.temp }}/x-collection-health.json
      run: python collect.py --check-x-health "$X_COLLECTION_HEALTH_REPORT"
